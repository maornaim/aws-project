apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aws-project
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/maornaim/aws-project.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
