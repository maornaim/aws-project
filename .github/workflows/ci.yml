name: CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - name: Download repository
        uses: actions/checkout@v6

      - name: Run integration test
        run: bash scripts/test.sh

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/maornaim/aws-project:latest
            ghcr.io/maornaim/aws-project:sha-${{ github.sha }}

      - name: Update image in Git
        if: github.event_name == 'push'
        run: |
          sed -i "s|image: ghcr.io/maornaim/aws-project:.*|image: ghcr.io/maornaim/aws-project:sha-${GITHUB_SHA}|" k8s/app.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/app.yaml
          git commit -m "Deploy image sha-${GITHUB_SHA}"
          git push
