name: CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Download repository
        uses: actions/checkout@v6

      - name: Run integration test
        run: bash scripts/test.sh

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/maornaim/aws-project:latest
            ghcr.io/maornaim/aws-project:sha-${{ github.sha }}

      - name: Connect to AWS
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::533267148415:role/maor-devops-github-actions-role
          aws-region: eu-central-1

      - name: Connect to EKS
        if: github.event_name == 'push'
        run: aws eks update-kubeconfig --name maor-devops-cluster --region eu-central-1

      - name: Apply Kubernetes files
        if: github.event_name == 'push'
        run: kubectl apply -f k8s/

      - name: Deploy new image
        if: github.event_name == 'push'
        run: kubectl set image deployment/app-deployment app=ghcr.io/maornaim/aws-project:sha-${{ github.sha }}

      - name: Wait for deployment
        if: github.event_name == 'push'
        run: kubectl rollout status deployment/app-deployment

      - name: Run smoke test
        if: github.event_name == 'push'
        run: bash scripts/smoke.sh
