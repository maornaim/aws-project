apiVersion: v1
kind: Service
metadata:
  name: app-metrics-service
  namespace: default
  labels:
    app: app-metrics
spec:
  type: ClusterIP
  selector:
    app: app
  ports:
    - name: metrics
      port: 8000
      targetPort: 8000

---

apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: app-metrics
  namespace: monitoring
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames:
      - default
  selector:
    matchLabels:
      app: app-metrics
  endpoints:
    - port: metrics
      path: /metrics
